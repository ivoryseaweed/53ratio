<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5:3 Layout Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.12);
      --border-strong: rgba(0,0,0,0.22);
      --text: #1a1a1a;
      --text-muted: #888;
      --text-hint: #bbb;
      --accent: #1a1a1a;
      --radius-sm: 6px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141414;
        --surface: #1e1e1e;
        --border: rgba(255,255,255,0.1);
        --border-strong: rgba(255,255,255,0.2);
        --text: #f0f0f0;
        --text-muted: #888;
        --text-hint: #555;
        --accent: #f0f0f0;
      }
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    header h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    header span {
      font-size: 12px;
      color: var(--text-muted);
    }

    .canvas-area {
      width: 100%;
      aspect-ratio: 10 / 3;
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--border-strong);
      overflow: hidden;
      background: var(--surface);
    }

    .slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      cursor: pointer;
      overflow: hidden;
      background: var(--surface);
      transition: background 0.15s;
    }

    .slot:first-child {
      border-right: 1px solid var(--border-strong);
    }

    .slot:hover {
      background: color-mix(in srgb, var(--surface) 92%, var(--text));
    }

    .slot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
      z-index: 1;
    }

    .placeholder svg {
      width: 32px;
      height: 32px;
      stroke: var(--text-hint);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .placeholder p {
      font-size: 12px;
      color: var(--text-hint);
      letter-spacing: 0.02em;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      z-index: 3;
    }

    .slot:hover .overlay { opacity: 1; }

    .overlay span {
      font-size: 12px;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 0.04em;
    }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .left-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      letter-spacing: 0.04em;
    }

    .btn-clear {
      font-size: 11px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      letter-spacing: 0.02em;
      transition: color 0.15s, background 0.15s;
    }

    .btn-clear:hover {
      color: var(--text);
      background: var(--border);
    }

    .btn-download {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--bg);
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      padding: 9px 20px;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-download:hover { opacity: 0.85; }
    .btn-download:active { transform: scale(0.98); }
    .btn-download:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    .btn-download svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    input[type=file] { display: none; }

    footer {
      font-size: 11px;
      color: var(--text-hint);
      text-align: center;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>5 : 3 Layout Tool</h1>
      <span>좌우 균등 · PNG 출력</span>
    </header>

    <div class="canvas-area">
      <div class="slot" id="slot-left" onclick="document.getElementById('inp-left').click()">
        <div class="placeholder" id="ph-left">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>클릭하여 이미지 업로드</p>
        </div>
        <div class="overlay"><span>이미지 교체</span></div>
      </div>

      <div class="slot" id="slot-right" onclick="document.getElementById('inp-right').click()">
        <div class="placeholder" id="ph-right">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p>클릭하여 이미지 업로드</p>
        </div>
        <div class="overlay"><span>이미지 교체</span></div>
      </div>
    </div>

    <div class="actions">
      <div class="left-actions">
        <span class="badge">비율 5 : 3 · 균등 분할</span>
        <button class="btn-clear" onclick="clearAll()">초기화</button>
      </div>
      <button class="btn-download" id="btn-dl" onclick="downloadImage()" disabled>
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        PNG 다운로드
      </button>
    </div>

    <footer>이미지는 브라우저 내에서만 처리되며 서버로 전송되지 않습니다.</footer>
  </div>

  <input type="file" id="inp-left" accept="image/*" onchange="loadImage(event,'left')">
  <input type="file" id="inp-right" accept="image/*" onchange="loadImage(event,'right')">

  <script>
    const state = { left: null, right: null };

    function loadImage(e, side) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          state[side] = img;

          const slot = document.getElementById('slot-' + side);
          const ph = document.getElementById('ph-' + side);

          let preview = slot.querySelector('img');
          if (!preview) {
            preview = document.createElement('img');
            slot.insertBefore(preview, slot.firstChild);
          }
          preview.src = ev.target.result;
          ph.style.display = 'none';
          checkDownload();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function checkDownload() {
      document.getElementById('btn-dl').disabled = !(state.left && state.right);
    }

    function clearAll() {
      ['left', 'right'].forEach(side => {
        state[side] = null;
        const slot = document.getElementById('slot-' + side);
        const preview = slot.querySelector('img');
        if (preview) preview.remove();
        document.getElementById('ph-' + side).style.display = '';
      });
      checkDownload();
    }

    // Cover-fit: fill box without distortion, crop from center
    function drawCover(ctx, img, x, y, w, h) {
      const imgRatio = img.naturalWidth / img.naturalHeight;
      const boxRatio = w / h;
      let sx, sy, sw, sh;

      if (imgRatio > boxRatio) {
        sh = img.naturalHeight;
        sw = sh * boxRatio;
        sx = (img.naturalWidth - sw) / 2;
        sy = 0;
      } else {
        sw = img.naturalWidth;
        sh = sw / boxRatio;
        sx = 0;
        sy = (img.naturalHeight - sh) / 2;
      }

      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    function downloadImage() {
      const imgL = state.left;
      const imgR = state.right;

      // Fixed output: 1179 x 707px (5:3 ratio, each half 589x707 = 5:3)
      const TARGET_W = 1179;
      const TARGET_H = 707;
      const halfW = Math.floor(TARGET_W / 2); // 589px each

      const canvas = document.createElement('canvas');
      canvas.width = TARGET_W;
      canvas.height = TARGET_H;

      const ctx = canvas.getContext('2d');

      // Left half — sharp rectangle clip
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, 0, halfW, TARGET_H);
      ctx.clip();
      drawCover(ctx, imgL, 0, 0, halfW, TARGET_H);
      ctx.restore();

      // Right half — sharp rectangle clip
      ctx.save();
      ctx.beginPath();
      ctx.rect(halfW, 0, halfW, TARGET_H);
      ctx.clip();
      drawCover(ctx, imgR, halfW, 0, halfW, TARGET_H);
      ctx.restore();

      const a = document.createElement('a');
      a.download = 'layout_5x3.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
